<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — School Website</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16233F; --navy-deep:#0D1526; --paper:#F4F5F7; --white:#fff;
  --gold:#C9973F; --sage:#5F7A5E; --coral:#D65B3E; --ink:#20262F; --ink-soft:#6B7280;
  --line:#E5E7EB; --radius:10px; --shadow:0 6px 20px rgba(15,23,42,.06);
  --font:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0; font-family:var(--font); background:var(--paper); color:var(--ink);}
a{color:inherit; text-decoration:none;}
button{font-family:var(--font); cursor:pointer;}
img{max-width:100%;}

/* ---------- LOGIN ---------- */
#loginScreen{
  position:fixed; inset:0; background:linear-gradient(160deg,var(--navy),var(--navy-deep));
  display:flex; align-items:center; justify-content:center; z-index:500;
}
.login-card{background:var(--white); border-radius:16px; padding:40px 36px; width:100%; max-width:380px; box-shadow:0 30px 60px rgba(0,0,0,.35);}
.login-card h1{font-size:20px; margin:0 0 4px;}
.login-card p{color:var(--ink-soft); font-size:13.5px; margin:0 0 24px;}
.login-card input{width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:8px; margin-bottom:14px; font-size:14.5px;}
.login-card button{width:100%; padding:12px; border-radius:8px; border:none; background:var(--navy); color:#fff; font-weight:600; font-size:14.5px;}
.login-err{color:var(--coral); font-size:13px; margin-bottom:10px; display:none;}

/* ---------- SHELL ---------- */
#app{display:none;}
.shell{display:grid; grid-template-columns:240px 1fr; min-height:100vh;}
.sidebar{background:var(--navy-deep); color:#fff; padding:22px 16px; display:flex; flex-direction:column;}
.sb-brand{display:flex; align-items:center; gap:10px; padding:0 10px 22px; font-weight:700; font-size:16px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:16px;}
.sb-item{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:8px; font-size:14px; font-weight:500;
  color:rgba(255,255,255,.65); cursor:pointer; margin-bottom:2px;
}
.sb-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.sb-item.active{background:var(--gold); color:var(--navy-deep); font-weight:700;}
.sb-icon{width:20px; text-align:center;}
.sb-bottom{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.1);}

.main{padding:26px 32px; overflow-y:auto;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
.topbar h2{margin:0; font-size:22px;}
.topbar .sub{color:var(--ink-soft); font-size:13.5px; margin-top:2px;}

.cards-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:26px;}
.stat-card{background:var(--white); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
.stat-card .num{font-size:28px; font-weight:700; font-family:var(--mono);}
.stat-card .lbl{color:var(--ink-soft); font-size:12.5px; margin-top:4px; text-transform:uppercase; letter-spacing:.04em;}

.panel{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; margin-bottom:20px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.panel-head h3{margin:0; font-size:16.5px;}

.btn{display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border-radius:8px; border:none; font-size:13.5px; font-weight:600; cursor:pointer;}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:var(--navy-deep);}
.btn-gold{background:var(--gold); color:var(--navy-deep);}
.btn-ghost{background:var(--paper); color:var(--ink);}
.btn-danger{background:#fde8e4; color:var(--coral);}
.btn-sm{padding:6px 12px; font-size:12.5px;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; padding:10px 12px; color:var(--ink-soft); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1.5px solid var(--line);}
td{padding:12px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.thumb-sm{width:44px; height:44px; border-radius:6px; object-fit:cover; background:var(--paper);}
.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600;}
.badge-new{background:#fde8e4; color:var(--coral);}
.badge-read{background:#e8ecf5; color:var(--navy);}
.badge-responded{background:#e5f0e4; color:var(--sage);}
.badge-pub{background:#e5f0e4; color:var(--sage);}
.badge-draft{background:#f1eee0; color:var(--gold);}
.row-actions{display:flex; gap:8px;}
.empty-row{text-align:center; color:var(--ink-soft); padding:30px;}

.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.toolbar input, .toolbar select{padding:9px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:13.5px; font-family:var(--font);}

/* ---------- MODAL ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(13,21,38,.55); display:none; align-items:center; justify-content:center; z-index:400; padding:20px;}
.modal-overlay.active{display:flex;}
.modal{background:#fff; border-radius:14px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 30px 60px rgba(0,0,0,.3);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--line);}
.modal-head h3{margin:0; font-size:17px;}
.modal-close{background:none; border:none; font-size:22px; color:var(--ink-soft); cursor:pointer;}
.modal-body{padding:22px 24px; display:flex; flex-direction:column; gap:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink-soft);}
.field input,.field select,.field textarea{
  width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:8px; font-size:14px; font-family:var(--font);
}
.field textarea{min-height:90px; resize:vertical;}
.field-row{display:flex; gap:12px;}
.field-row > *{flex:1;}
.upload-toggle{display:flex; gap:8px; margin-bottom:6px;}
.upload-toggle button{flex:1; padding:8px; border-radius:8px; border:1.5px solid var(--line); background:var(--paper); font-size:12.5px; font-weight:600;}
.upload-toggle button.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.file-hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
.modal-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.toast{position:fixed; bottom:24px; right:24px; background:var(--navy-deep); color:#fff; padding:14px 20px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow); z-index:600; display:none;}
.toast.err{background:var(--coral);}
.preview-img{max-height:120px; border-radius:8px; margin-top:6px; display:none;}

@media(max-width:900px){
  .shell{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .main{padding:18px;}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Admin Sign In</h1>
    <p>School Website Control Panel</p>
    <div class="login-err" id="loginErr"></div>
    <input type="password" id="loginPassword" placeholder="Admin password">
    <button id="loginBtn">Sign In</button>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="sb-brand">🏫 <span>Admin Panel</span></div>
      <div class="sb-item active" data-view="dashboard"><span class="sb-icon">📊</span>Dashboard</div>
      <div class="sb-item" data-view="gallery"><span class="sb-icon">🖼️</span>Gallery</div>
      <div class="sb-item" data-view="news"><span class="sb-icon">📰</span>News</div>
      <div class="sb-item" data-view="videos"><span class="sb-icon">🎬</span>Videos</div>
      <div class="sb-item" data-view="featured"><span class="sb-icon">⭐</span>Featured Media</div>
      <div class="sb-item" data-view="events"><span class="sb-icon">📅</span>Calendar</div>
      <div class="sb-item" data-view="programs"><span class="sb-icon">🎓</span>Programs</div>
      <div class="sb-item" data-view="steps"><span class="sb-icon">🧭</span>Admission Steps</div>
      <div class="sb-item" data-view="affiliations"><span class="sb-icon">🏵️</span>Affiliations</div>
      <div class="sb-item" data-view="enquiries"><span class="sb-icon">✉️</span>Enquiries</div>
      <div class="sb-item" data-view="settings"><span class="sb-icon">⚙️</span>Settings</div>
      <div class="sb-bottom">
        <div class="sb-item" id="logoutBtn"><span class="sb-icon">🚪</span>Log Out</div>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div><h2 id="viewTitle">Dashboard</h2><div class="sub" id="viewSub">Overview of your website</div></div>
      </div>
      <div id="viewContent"></div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ================= MODAL (shared) ================= -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">Add Item</h3><button class="modal-close" id="modalClose">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycby-iW_Itpjpt5xWVmbWYA7pGAv6QvXctNap8pusiBkrvZn7WIZli4opI_u0v0A76Wha/exec';
let TOKEN = sessionStorage.getItem('admin_token') || '';

/* ---------- API layer (plain fetch — Apps Script returns readable CORS responses) ---------- */
function apiGet(action, params) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('token', TOKEN);
  Object.keys(params || {}).forEach(function (k) {
    const v = params[k];
    if (v !== undefined && v !== null) url.searchParams.set(k, v);
  });
  return fetch(url.toString())
    .then(function (res) { return res.json(); })
    .catch(function (err) { return { ok: false, error: 'Network error: ' + err.message }; });
}

/**
 * POST body is plain text (not application/json) so the browser treats
 * this as a "simple request" and skips the CORS preflight — Apps Script
 * doesn't implement doOptions, so a preflighted request would fail.
 */
function apiPost(action, payload) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, token: TOKEN }, payload))
  })
    .then(function (res) { return res.json(); })
    .catch(function (err) { return { ok: false, error: 'Network error: ' + err.message }; });
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function fmtDate(d) { const dt = new Date(d); return isNaN(dt) ? '' : dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isErr ? ' err' : '');
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 3000);
}
function fileToBase64(file) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function () { resolve(r.result.split(',')[1]); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* =========================================================
   AUTH
   ========================================================= */
function showLogin() { document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('app').style.display = 'none'; }
function showApp() { document.getElementById('loginScreen').style.display = 'none'; document.getElementById('app').style.display = 'block'; renderView('dashboard'); }

document.getElementById('loginBtn').onclick = function () { doLogin(); };
document.getElementById('loginPassword').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
function doLogin() {
  const pw = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Signing in…'; btn.disabled = true;
  apiPost('login', { password: pw }).then(function (res) {
    btn.textContent = 'Sign In'; btn.disabled = false;
    if (res && res.ok) {
      TOKEN = res.token;
      sessionStorage.setItem('admin_token', TOKEN);
      showApp();
    } else {
      document.getElementById('loginErr').style.display = 'block';
      document.getElementById('loginErr').textContent = (res && res.error) || 'Login failed';
    }
  });
}
document.getElementById('logoutBtn').onclick = function () {
  apiPost('logout', {});
  sessionStorage.removeItem('admin_token');
  TOKEN = '';
  showLogin();
};

(function initAuth() {
  if (!TOKEN) { showLogin(); return; }
  apiGet('checkSession', {}).then(function (res) {
    if (res && res.ok) showApp(); else showLogin();
  });
})();

/* =========================================================
   SIDEBAR / ROUTING
   ========================================================= */
document.querySelectorAll('.sb-item[data-view]').forEach(function (item) {
  item.onclick = function () {
    document.querySelectorAll('.sb-item[data-view]').forEach(function (i) { i.classList.remove('active'); });
    item.classList.add('active');
    renderView(item.dataset.view);
  };
});

const VIEW_META = {
  dashboard: ['Dashboard', 'Overview of your website'],
  gallery: ['Gallery', 'Manage photo gallery items'],
  news: ['News', 'Publish and manage news posts'],
  videos: ['Videos', 'Manage YouTube video listings'],
  featured: ['Featured Media', 'Curate the homepage spotlight strip'],
  events: ['Calendar', 'Manage school events and key dates'],
  programs: ['Programs', 'Academic programs shown on the homepage'],
  steps: ['Admission Steps', 'The step-by-step admissions process shown on the homepage'],
  affiliations: ['Affiliations', 'Board/council logos shown in the homepage marquee'],
  enquiries: ['Enquiries', 'Messages from the enquiry form'],
  settings: ['Settings', 'Site-wide configuration']
};

function renderView(view) {
  document.getElementById('viewTitle').textContent = VIEW_META[view][0];
  document.getElementById('viewSub').textContent = VIEW_META[view][1];
  const c = document.getElementById('viewContent');
  c.innerHTML = '<div class="panel">Loading…</div>';
  ({
    dashboard: renderDashboard, gallery: renderGallery, news: renderNews, videos: renderVideos,
    featured: renderFeatured, events: renderEvents, programs: renderPrograms, steps: renderSteps,
    affiliations: renderAffiliations, enquiries: renderEnquiries, settings: renderSettings
  })[view](c);
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function renderDashboard(c) {
  apiGet('getStats', {}).then(function (res) {
    if (!res.ok) { c.innerHTML = '<div class="panel">Failed to load stats.</div>'; return; }
    const s = res.data;
    c.innerHTML =
      '<div class="cards-row">' +
      statCard(s.gallery, 'Gallery Items') + statCard(s.news, 'News Posts') + statCard(s.videos, 'Videos') +
      statCard(s.events, 'Events') + statCard(s.enquiries, 'Total Enquiries') + statCard(s.newEnquiries, 'New Enquiries') +
      statCard(s.programs, 'Programs') + statCard(s.steps, 'Admission Steps') + statCard(s.affiliations, 'Affiliations') +
      '</div>' +
      '<div class="panel"><h3 style="margin-top:0;">Quick tips</h3>' +
      '<p style="color:var(--ink-soft);font-size:13.5px;line-height:1.7;">' +
      'Use <strong>Settings</strong> to turn on the homepage popup announcement and update contact details. ' +
      'New enquiries appear under <strong>Enquiries</strong> — mark them as read or responded once handled. ' +
      'PDF uploads in News are capped at 1&nbsp;MB; images are capped at 4&nbsp;MB.</p></div>';
  });
}
function statCard(num, lbl) { return '<div class="stat-card"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>'; }

/* =========================================================
   GENERIC TABLE PANEL BUILDER
   ========================================================= */
function panelShell(title, addLabel, extraToolbar) {
  return '<div class="panel"><div class="panel-head"><h3>' + title + '</h3>' +
    '<div class="toolbar">' + (extraToolbar || '') + '<button class="btn btn-primary" id="addBtn">+ ' + addLabel + '</button></div></div>' +
    '<div id="tableWrap"><div class="empty-row">Loading…</div></div></div>';
}

/* =========================================================
   GALLERY
   ========================================================= */
function renderGallery(c) {
  c.innerHTML = panelShell('Gallery Items', 'Add Photo');
  document.getElementById('addBtn').onclick = function () { openGalleryModal(); };
  loadGalleryTable();
}
function loadGalleryTable() {
  apiGet('getGallery', {}).then(function (res) {
    const wrap = document.getElementById('tableWrap');
    if (!res.ok) { wrap.innerHTML = '<div class="empty-row">Failed to load.</div>'; return; }
    const rows = res.data;
    if (!rows.length) { wrap.innerHTML = '<div class="empty-row">No gallery items yet — click "Add Photo" to get started.</div>'; return; }
    wrap.innerHTML = '<table><thead><tr><th></th><th>Title</th><th>Category</th><th>Source</th><th>Added</th><th></th></tr></thead><tbody>' +
      rows.map(function (g) {
        return '<tr><td><img class="thumb-sm" src="' + esc(g.imageUrl) + '"></td><td>' + esc(g.title) + '</td><td>' + esc(g.category) +
          '</td><td>' + esc(g.source) + '</td><td>' + fmtDate(g.createdAt) + '</td>' +
          '<td class="row-actions"><button class="btn btn-sm btn-ghost" data-edit="' + g.id + '">Edit</button>' +
          '<button class="btn btn-sm btn-danger" data-del="' + g.id + '">Delete</button></td></tr>';
      }).join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { openGalleryModal(rows.find(function (r) { return r.id === b.dataset.edit; })); }; });
    wrap.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { confirmDelete('deleteGallery', b.dataset.del, loadGalleryTable); }; });
  });
}
function openGalleryModal(item) {
  const isEdit = !!item;
  openModal(isEdit ? 'Edit Photo' : 'Add Photo', function (body) {
    body.innerHTML =
      field('Title', '<input id="f_title" value="' + esc(item ? item.title : '') + '">') +
      field('Category', '<input id="f_category" value="' + esc(item ? item.category : 'General') + '">') +
      '<div class="field"><label>Image Source</label><div class="upload-toggle">' +
      '<button type="button" class="active" id="srcLinkBtn">Paste Link</button>' +
      '<button type="button" id="srcUploadBtn">Upload File</button></div>' +
      '<input id="f_link" placeholder="https://…" value="' + esc(item && item.source !== 'upload' ? item.imageUrl : '') + '">' +
      '<input id="f_file" type="file" accept="image/*" style="display:none;">' +
      '<div class="file-hint">Direct uploads are stored in Google Drive automatically. Max 4MB.</div>' +
      '<img id="f_preview" class="preview-img" src="' + (item ? esc(item.imageUrl) : '') + '" style="' + (item ? 'display:block;' : '') + '"></div>';
    let mode = item && item.source === 'upload' ? 'upload' : 'link';
    const linkBtn = body.querySelector('#srcLinkBtn'), uploadBtn = body.querySelector('#srcUploadBtn');
    const linkInput = body.querySelector('#f_link'), fileInput = body.querySelector('#f_file');
    function syncMode() {
      linkBtn.classList.toggle('active', mode === 'link');
      uploadBtn.classList.toggle('active', mode === 'upload');
      linkInput.style.display = mode === 'link' ? 'block' : 'none';
      fileInput.style.display = mode === 'upload' ? 'block' : 'none';
    }
    linkBtn.onclick = function () { mode = 'link'; syncMode(); };
    uploadBtn.onclick = function () { mode = 'upload'; syncMode(); };
    syncMode();
    fileInput.onchange = function () {
      const f = fileInput.files[0];
      if (f) { const r = new FileReader(); r.onload = function () { body.querySelector('#f_preview').src = r.result; body.querySelector('#f_preview').style.display = 'block'; }; r.readAsDataURL(f); }
    };
    body._getPayload = async function () {
      const title = body.querySelector('#f_title').value.trim();
      const category = body.querySelector('#f_category').value.trim() || 'General';
      if (!title) { toast('Title is required', true); return null; }
      if (mode === 'link') {
        const url = linkInput.value.trim();
        if (!url) { toast('Please paste an image link', true); return null; }
        return { title: title, category: category, imageUrl: url, source: 'link', driveFileId: '' };
      } else {
        const f = fileInput.files[0];
        if (!f && !item) { toast('Please choose a file', true); return null; }
        if (!f) return { title: title, category: category, imageUrl: item.imageUrl, source: item.source, driveFileId: item.driveFileId };
        if (f.size > 4 * 1024 * 1024) { toast('Image exceeds 4MB limit', true); return null; }
        const base64 = await fileToBase64(f);
        const up = await apiPost('uploadFile', { base64: base64, mimeType: f.type, fileName: f.name, kind: 'image' });
        if (!up || !up.ok) { toast((up && up.error) || 'Upload failed', true); return null; }
        return { title: title, category: category, imageUrl: up.url, source: 'upload', driveFileId: up.fileId };
      }
    };
  }, async function () {
    const payload = await document.getElementById('modalBody')._getPayload();
    if (!payload) return false;
    const res = await apiPost(isEdit ? 'updateGallery' : 'createGallery', isEdit ? Object.assign({ id: item.id }, payload) : payload);
    if (res && res.ok) { toast('Saved'); loadGalleryTable(); return true; }
    toast((res && res.error) || 'Save failed', true); return false;
  });
}

/* =========================================================
   NEWS
   ========================================================= */
function renderNews(c) {
  c.innerHTML = panelShell('News Posts', 'Add News');
  document.getElementById('addBtn').onclick = function () { openNewsModal(); };
  loadNewsTable();
}
function loadNewsTable() {
  apiGet('getNews', { limit: 999 }).then(function (res) {
    const wrap = document.getElementById('tableWrap');
    if (!res.ok) { wrap.innerHTML = '<div class="empty-row">Failed to load.</div>'; return; }
    const rows = res.data.items;
    if (!rows.length) { wrap.innerHTML = '<div class="empty-row">No news posts yet.</div>'; return; }

      '<button type="button" id="imgUploadBtn">Upload File</button></div>' +

      '<div class="field"><label>PDF Attachment (optional)</label><div class="upload-toggle">' +
      '<button type="button" class="active" id="pdfLinkBtn">Paste Link</button>' +
      '<button type="button" id="pdfUploadBtn">Upload File</button></div>' +
      '<input id="f_pdf_link" placeholder="https://…" value="' + esc(item && !item.pdfFileId ? item.pdfUrl : '') + '">' +
      '<input id="f_pdf_file" type="file" accept="application/pdf" style="display:none;">' +
      '<div class="file-hint">Uploads capped at 1MB, PDF only. If sharing via an external Google Drive link, please copy the link after setting "Share with anyone" — otherwise it won\'t open for visitors.</div>' +
      '<div id="f_pdf_name" style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">' + (item && item.pdfUrl ? '📄 Existing PDF attached' : '') + '</div></div>' +

      field('Status', '<select id="f_pub"><option value="true"' + (!item || String(item.published) !== 'false' ? ' selected' : '') + '>Published</option><option value="false"' + (item && String(item.published) === 'false' ? ' selected' : '') + '>Draft</option></select>');

    /* ---- image link/upload toggle ---- */
    let imgMode = (item && item.imageFileId) ? 'upload' : 'link';
    const imgLinkBtn = body.querySelector('#imgLinkBtn'), imgUploadBtn = body.querySelector('#imgUploadBtn');
    const imgLinkInput = body.querySelector('#f_img_link'), imgFileInput = body.querySelector('#f_img_file');
    const imgPreview = body.querySelector('#f_img_preview');
    function syncImgMode() {
      imgLinkBtn.classList.toggle('active', imgMode === 'link');
      imgUploadBtn.classList.toggle('active', imgMode === 'upload');
      imgLinkInput.style.display = imgMode === 'link' ? 'block' : 'none';
      imgFileInput.style.display = imgMode === 'upload' ? 'block' : 'none';
    }
    imgLinkBtn.onclick = function () { imgMode = 'link'; syncImgMode(); };
    imgUploadBtn.onclick = function () { imgMode = 'upload'; syncImgMode(); };
    syncImgMode();
    imgLinkInput.oninput = function () {
      const v = imgLinkInput.value.trim();
      if (v) { imgPreview.src = v; imgPreview.style.display = 'block'; } else { imgPreview.style.display = 'none'; }
    };
    imgFileInput.onchange = function () {
      const f = imgFileInput.files[0];
      if (f) { const r = new FileReader(); r.onload = function () { imgPreview.src = r.result; imgPreview.style.display = 'block'; }; r.readAsDataURL(f); }
    };

    /* ---- pdf link/upload toggle ---- */
    let pdfMode = (item && item.pdfFileId) ? 'upload' : 'link';
    const pdfLinkBtn = body.querySelector('#pdfLinkBtn'), pdfUploadBtn = body.querySelector('#pdfUploadBtn');
    const pdfLinkInput = body.querySelector('#f_pdf_link'), pdfFileInput = body.querySelector('#f_pdf_file');
    const pdfNameEl = body.querySelector('#f_pdf_name');
    function syncPdfMode() {
      pdfLinkBtn.classList.toggle('active', pdfMode === 'link');
      pdfUploadBtn.classList.toggle('active', pdfMode === 'upload');
      pdfLinkInput.style.display = pdfMode === 'link' ? 'block' : 'none';
      pdfFileInput.style.display = pdfMode === 'upload' ? 'block' : 'none';
    }
    pdfLinkBtn.onclick = function () { pdfMode = 'link'; syncPdfMode(); };
    pdfUploadBtn.onclick = function () { pdfMode = 'upload'; syncPdfMode(); };
    syncPdfMode();
    pdfLinkInput.oninput = function () {
      const v = pdfLinkInput.value.trim();
      pdfNameEl.textContent = v ? '🔗 Linked PDF' : '';
    };
    pdfFileInput.onchange = function () {
      const f = pdfFileInput.files[0];
      if (f) pdfNameEl.textContent = f.name + ' (' + Math.round(f.size / 1024) + ' KB)';
    };

    body._getPayload = async function () {
      const title = body.querySelector('#f_title').value.trim();
      if (!title) { toast('Title is required', true); return null; }
      const payload = {
        title: title, summary: body.querySelector('#f_summary').value.trim(),
        content: body.querySelector('#f_content').value.trim(),
        category: body.querySelector('#f_category').value.trim() || 'General',
        author: body.querySelector('#f_author').value.trim() || 'Admin',
        published: body.querySelector('#f_pub').value,
        imageUrl: item ? item.imageUrl : '', imageFileId: item ? item.imageFileId : '',
        pdfUrl: item ? item.pdfUrl : '', pdfFileId: item ? item.pdfFileId : '',
        date: item ? item.date : new Date().toISOString()
      };

      /* --- cover image --- */
      if (imgMode === 'link') {
        payload.imageUrl = imgLinkInput.value.trim();
        payload.imageFileId = '';
      } else {
        const imgFile = imgFileInput.files[0];
        if (imgFile) {
          if (imgFile.size > 4 * 1024 * 1024) { toast('Image exceeds 4MB limit', true); return null; }
          const b64 = await fileToBase64(imgFile);
          const up = await apiPost('uploadFile', { base64: b64, mimeType: imgFile.type, fileName: imgFile.name, kind: 'image' });
          if (!up || !up.ok) { toast((up && up.error) || 'Image upload failed', true); return null; }
          payload.imageUrl = up.url; payload.imageFileId = up.fileId;
        }
      }

      /* --- pdf attachment --- */
      if (pdfMode === 'link') {
        const pdfLink = pdfLinkInput.value.trim();
        if (pdfLink) { payload.pdfUrl = pdfLink; payload.pdfFileId = ''; }
      } else {
        const pdfFile = pdfFileInput.files[0];
        if (pdfFile) {
          if (pdfFile.type !== 'application/pdf') { toast('Attachment must be a PDF', true); return null; }
          if (pdfFile.size > 1024 * 1024) { toast('PDF exceeds 1MB limit', true); return null; }
          const b64 = await fileToBase64(pdfFile);
          const up = await apiPost('uploadFile', { base64: b64, mimeType: pdfFile.type, fileName: pdfFile.name, kind: 'pdf' });
          if (!up || !up.ok) { toast((up && up.error) || 'PDF upload failed', true); return null; }
          payload.pdfUrl = up.url; payload.pdfFileId = up.fileId;
        }
      }

      return payload;
    };
  }, async function () {
    const payload = await document.getElementById('modalBody')._getPayload();
    if (!payload) return false;
    const res = await apiPost(isEdit ? 'updateNews' : 'createNews', isEdit ? Object.assign({ id: item.id }, payload) : payload);
    if (res && res.ok) { toast('Saved'); loadNewsTable(); return true; }
    toast((res && res.error) || 'Save failed', true); return false;
  });
}

/* =========================================================
   SHARED MODAL + HELPERS
   ========================================================= */
function field(label, inputHtml) { return '<div class="field"><label>' + label + '</label>' + inputHtml + '</div>'; }

let currentSaveHandler = null;
function openModal(title, buildFn, saveFn) {
  document.getElementById('modalTitle').textContent = title;
  const body = document.getElementById('modalBody');
  body.innerHTML = '';
  buildFn(body);
  currentSaveHandler = saveFn;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); currentSaveHandler = null; }
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modalSave').onclick = async function () {
  if (!currentSaveHandler) return;
  const btn = this;
  btn.textContent = 'Saving…'; btn.disabled = true;
  const ok = await currentSaveHandler();
  btn.textContent = 'Save'; btn.disabled = false;
  if (ok) closeModal();
};

function confirmDelete(action, id, refreshFn) {
  if (!confirm('Delete this item? This cannot be undone.')) return;
  apiPost(action, { id: id }).then(function (res) {
    if (res && res.ok) { toast('Deleted'); refreshFn(); } else { toast((res && res.error) || 'Delete failed', true); }
  });
}
